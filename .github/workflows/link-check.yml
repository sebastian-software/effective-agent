name: Link Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "site/**/*.html"
      - ".lycheeignore"
      - "lychee.toml"
      - "scripts/check-links.py"
      - ".github/lychee-ci.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: 2026.10.2
          install_args: --locked lychee

      # Every link, but only gone links and missing anchors fail here; see
      # .github/lychee-ci.toml. The pre-push hook checks strictly.
      - name: Check Markdown and site links
        run: >-
          python3 scripts/check-links.py lychee --config lychee.toml --config .github/lychee-ci.toml
          './**/*.md' './site/**/*.html'
